<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random</title>
  <style>
    body {
      background-color: #777;
      background-image: url('https://www.wikipedia.org/portal/wikipedia.org/assets/img/Wikipedia-logo-v2@2x.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: 720px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

		.profile-card {
			background-color: rgba(0, 0, 0, 0.7);
			backdrop-filter: blur(16px);
			border: 1px solid #000;
			border-radius: 16px;
			width: 360px;
			height: 150px;
			padding: 48px 48px;
			margin-top: 48px;
			margin-bottom: 48px;
			box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
		}


    /* Avatar Box with Gradient Border */
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eee, #999);
      background-image: url('https://pbs.twimg.com/profile_images/1116326751712481280/cPzOGLEU.png');
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: bold;
      color: #0f172a;
      margin: 0 auto 20px auto;
    }

    /* Typography */
    h1 {
      font-size: 1.5rem;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      color: #ffffff;
    }

    .title {
      color: #999;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bio {
      color: #ccc;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Skill Tags */
    .tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tag {
      background-color: #333;
      color: #eee;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* Action Button */
    .btn {
      display: block;
      background-color: #aaa;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 0;
      border-radius: 8px;
      text-align: center;
      transition:
        background-color 0.2s ease,
        transform 0.1s ease;
    }

    .btn:hover {
      background-color: #fff;
      color: #333;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="profile-card">

        <a href="index.html" class="btn" style="align-self: left; width: 100px; margin-bottom: 45px">
          < HOME</a>

    <a href="https://en.wikipedia.org/wiki/Special:Random" class="btn">Random Wikipedia page</a>
  </div>
</body>

</html>
